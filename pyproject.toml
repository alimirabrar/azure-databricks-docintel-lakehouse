[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "azure-databricks-docintel-lakehouse"
version = "0.1.0"
description = "Document intelligence lakehouse on Azure Databricks: OCR + Azure OpenAI structured extraction, Pydantic validation, Delta medallion tables and MLflow-tracked accuracy."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mir Abrar Ali" }]
requires-python = ">=3.10"
keywords = ["azure", "databricks", "pyspark", "mlflow", "azure-openai", "document-intelligence", "llm", "delta-lake"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.6,<3",
  "openai>=1.40",
]

[project.optional-dependencies]
# pyspark and mlflow are pre-installed on Databricks Runtime; install them locally.
local = ["pyspark>=3.5,<4", "mlflow-skinny>=2.14", "sqlalchemy>=2", "alembic>=1.13"]
azure = ["azure-identity>=1.16", "azure-ai-documentintelligence>=1.0.0"]
pdf = ["pypdf>=4"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
docintel = "docintel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docintel"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
