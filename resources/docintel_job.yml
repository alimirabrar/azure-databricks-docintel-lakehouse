resources:
  jobs:
    docintel_medallion:
      name: docintel-medallion-${bundle.target}
      max_concurrent_runs: 1
      parameters:
        - { name: catalog, default: "${var.catalog}" }
        - { name: schema, default: "${var.schema}" }
        - { name: landing_path, default: "${var.landing_path}" }
        - { name: labels_path, default: "${var.labels_path}" }
        - { name: llm_client, default: "${var.llm_client}" }
        - { name: prompt_version, default: "${var.prompt_version}" }
        - { name: experiment, default: "/Shared/docintel-extraction-${bundle.target}" }
        - { name: llm_partitions, default: "8" }

      job_clusters:
        - job_cluster_key: docintel
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: ${var.node_type}
            num_workers: 1
            data_security_mode: SINGLE_USER
            spark_env_vars:
              DOCINTEL_LLM_CLIENT: "${var.llm_client}"
              AZURE_OPENAI_ENDPOINT: "${var.azure_openai_endpoint}"
              AZURE_OPENAI_DEPLOYMENT: "${var.azure_openai_deployment}"
              MLFLOW_DISABLE_AGENT_HINT: "1"

      tasks:
        - task_key: bronze_ingest
          job_cluster_key: docintel
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingest.py
          libraries:
            - whl: ../dist/*.whl

        - task_key: silver_extract
          depends_on: [{ task_key: bronze_ingest }]
          job_cluster_key: docintel
          notebook_task:
            notebook_path: ../notebooks/02_silver_extract.py
          libraries:
            - whl: ../dist/*.whl

        - task_key: gold_analytics
          depends_on: [{ task_key: silver_extract }]
          job_cluster_key: docintel
          notebook_task:
            notebook_path: ../notebooks/03_gold_analytics.py
          libraries:
            - whl: ../dist/*.whl

        - task_key: evaluate_mlflow
          depends_on: [{ task_key: silver_extract }]
          job_cluster_key: docintel
          notebook_task:
            notebook_path: ../notebooks/04_evaluate_mlflow.py
          libraries:
            - whl: ../dist/*.whl

      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: Asia/Kolkata
        pause_status: PAUSED
